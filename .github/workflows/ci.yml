name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  NDK_VERSION: "27.0.12077973"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android NDK
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unexpected-keyboard-debug-${{ github.sha }}
          path: build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/reports/lint-results-debug.html
            build/reports/lint-results-debug.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        run: |
          {
            echo "### Build"
            echo "- APK: \`$(du -h build/outputs/apk/debug/*.apk | cut -f1)\`"
            echo "- Commit: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  signed-dev-apk:
    name: Signed development APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
          fetch-depth: 0

      - name: Check signing secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_KEYSTORE_BASE64 is not configured; skipping signed dev APK."
          fi

      - name: Set up JDK
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.secrets.outputs.enabled == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android NDK
        if: steps.secrets.outputs.enabled == 'true'
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi

      - name: Decode keystore
        if: steps.secrets.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dev.jks"

      - name: Build debug APK signed with the release key
        if: steps.secrets.outputs.enabled == 'true'
        env:
          DEBUG_KEYSTORE: ${{ runner.temp }}/dev.jks
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS || 'unexpected' }}
          DEBUG_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload signed dev APK
        if: steps.secrets.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unexpected-keyboard-dev-${{ github.sha }}
          path: build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
