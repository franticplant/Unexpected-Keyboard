name: Check generated files

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generated-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  generated:
    name: Regenerate and compare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate checked-in files
        run: |
          python3 gen_layouts.py
          python3 check_layout.py
          python3 gen_method_xml.py > res/xml/method.xml
          python3 srcs/compose/compile.py srcs/compose/*.json srcs/compose/compose \
            > srcs/juloo.keyboard2/ComposeKeyData.java

      - name: Fail if regeneration changed anything
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are stale. Run the generators and commit the result."
            exit 1
          fi
