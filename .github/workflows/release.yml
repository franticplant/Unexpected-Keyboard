name: Release

# Builds a signed release APK, generates a checksum file and an SPDX SBOM,
# attests both with Sigstore, and publishes a GitHub release.
#
# Triggered by a tag like v2.1.0-fork.1, or manually for an existing tag.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   RELEASE_KEYSTORE_BASE64    base64 of the release .jks
#   RELEASE_KEYSTORE_PASSWORD  keystore password
#   RELEASE_KEY_PASSWORD       key password (optional; defaults to the store password)
# Optional repository variables:
#   RELEASE_KEY_ALIAS          key alias (default: unexpected)
#
# The secrets are only exposed to the "release" environment. Protect it with
# required reviewers or a tag rule before relying on it.
#
# Release notes come from docs/release-notes/<tag>.md at the tag. Without it,
# GitHub's generated notes are used.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (e.g. v2.1.0-fork.1)
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      version: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          version="${TAG#v}"
          base="${version%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          code=$((major * 1000000 + minor * 10000 + patch * 100))
          if [[ "$version" =~ -fork\.([0-9]+)$ ]]; then
            code=$((code + BASH_REMATCH[1]))
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Resolved $version (versionCode $code)"

      - name: Record commit
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          NDK_VERSION: "27.0.12077973"
        run: |
          if [[ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set; see the workflow header."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ vars.RELEASE_KEY_ALIAS || 'unexpected' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PforkVersionName="${{ steps.version.outputs.name }}" \
            -PforkVersionCode="${{ steps.version.outputs.code }}"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          apk=$(find build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [[ -z "$apk" ]]; then
            echo "::error::No release APK was produced."
            exit 1
          fi
          cp "$apk" "dist/unexpected-keyboard-$TAG.apk"
          cp "$RUNNER_TEMP/sbom.spdx.json" "dist/unexpected-keyboard-$TAG.spdx.json"
          (cd dist && sha256sum * | grep -v SHA256SUMS > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/unexpected-keyboard-${{ env.TAG }}.spdx.json

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          sparse-checkout: docs/release-notes
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ env.TAG }}
          path: dist

      - name: Verify checksums and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          for f in dist/*; do
            [[ $(basename "$f") == SHA256SUMS ]] && continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" > /dev/null
            echo "verified: $f"
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ needs.build.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          prerelease=""
          if [[ "$VERSION" == *-* || "$VERSION" == 0.* ]]; then prerelease="--prerelease"; fi

          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ $draft != true ]]; then
              echo "::error::$TAG is already published; releases are immutable. Cut a new tag."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
            exit 0
          fi

          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > generated.md
          if [[ -f "docs/release-notes/$TAG.md" ]]; then
            { cat "docs/release-notes/$TAG.md"; echo; grep -m1 'Full Changelog' generated.md || true; } > notes.md
          else
            echo "::warning::docs/release-notes/$TAG.md not found; using GitHub's generated notes."
            mv generated.md notes.md
          fi

          {
            echo
            echo "---"
            echo "Built by GitHub Actions from \`$BUILD_SHA\`."
            echo
            echo "Verify a download with:"
            echo
            echo '```'
            echo "gh attestation verify <file> -R $GH_REPO"
            echo "sha256sum -c SHA256SUMS"
            echo '```'
          } >> notes.md

          gh release create "$TAG" dist/* $prerelease --verify-tag \
            --title "$TAG" --notes-file notes.md
